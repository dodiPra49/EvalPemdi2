services:
  mariadb:
    image: mariadb:10.11
    container_name: evalpemdi_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecretpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-evalpemdi_db}
      MYSQL_USER: ${DB_USERNAME:-evalpemdi_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-evalpemdi_password}
    ports:
      - "${HOST_DB_PORT:-3310}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - evalpemdi_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: evalpemdi_redis
    restart: always
    ports:
      - "${HOST_REDIS_PORT:-6381}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - evalpemdi_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./laravel-db
      dockerfile: Dockerfile
    container_name: evalpemdi_app
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./laravel-db:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-evalpemdi_db}
      DB_USERNAME: ${DB_USERNAME:-evalpemdi_user}
      DB_PASSWORD: ${DB_PASSWORD:-evalpemdi_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${HOST_APP_PORT:-8000}:8000"
    networks:
      - evalpemdi_net

networks:
  evalpemdi_net:
    driver: bridge

volumes:
  mariadb_data:
  redis_data:
